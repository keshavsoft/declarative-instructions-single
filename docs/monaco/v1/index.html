<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    if (!location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <title>declarative-instructions-single | Monaco V1</title>
  <link rel="stylesheet" href="./workspace/css/workspace.css">
  <link rel="stylesheet" href="./components/left/css/left.css">
  <link rel="stylesheet" href="./components/right/css/right.css">
</head>

<body>
  <main class="workspace" id="leftWorkspace">
    <aside class="left-workspace" aria-label="Instruction Selectors">
      <div class="studio-top">
        <span class="studio-badge studio-badge--sky">DECLARATIVE INSTRUCTIONS · SINGLE</span>
        <a href="../index.html" class="hub-link">&larr; Catalog versions</a>
      </div>

      <p class="studio-story">
        Select an instruction key below to inspect its JSON definition from <code class="story-code">declarative-instructions-single</code>.
      </p>

      <div class="control-group">
        <label for="instructionInput">Instruction Key</label>
        <input id="instructionInput" type="text" list="instructionOptions" placeholder="Type or select a key" autocomplete="off" spellcheck="false">
        <datalist id="instructionOptions"></datalist>
      </div>

      <button id="showAll" class="show-all-btn" type="button">Show all</button>
    </aside>

    <section class="right-workspace" id="rightWorkspace" aria-label="Monaco Editor">
      <div class="editor-header">
        <div class="editor-header-left">
          <span id="editorTitle">instructions.json</span>
          <span id="editorPath">Complete V5 catalog</span>
        </div>
        <div class="editor-header-right">
          <span id="editorUrl" class="editor-url-pill" title=""></span>
        </div>
      </div>
      <div id="monacoEditor" class="monaco-editor"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script type="module" src="./index.js"></script>
</body>

</html>
